; Photography-friendly PHP limits for the NZ Nature WordPress image.
; Mounted read-only at /usr/local/etc/php/conf.d/uploads.ini
;
; Raise upload_max_filesize/post_max_size together — post_max_size must be
; larger than upload_max_filesize. Also set the same limits on any reverse
; proxy (e.g. Nginx `client_max_body_size 140m;`).
upload_max_filesize = 128M
post_max_size       = 132M
memory_limit        = 512M
max_execution_time  = 300
max_input_time      = 300
max_file_uploads    = 60

; Defense-in-depth for the 23 Oct 2026 "session upload progress" advisory
; (CVE-2026-115560). WordPress does not use session upload progress.
session.upload_progress.enabled = 0

; Don't advertise the PHP version in HTTP responses.
expose_php = Off
